<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실험용 스토어 - 카테고리</title>

    <style>
        :root { --primary-color: #3498db; --bg-gray: #f8f9fa; --border-color: #ddd; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; background: var(--bg-gray); color: #333; }
        
        /* 왼쪽 필터 바 */
        aside { width: 250px; background: white; padding: 20px; border-right: 1px solid var(--border-color); height: 100vh; position: sticky; top: 0; }
        .filter-group { margin-bottom: 25px; }
        .filter-group h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .filter-item { margin: 8px 0; font-size: 14px; display: flex; align-items: center; cursor: pointer; }
        .filter-item input { margin-right: 8px; }

        /* 오른쪽 상품 그리드 */
        main { flex: 1; padding: 30px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .product-card { background: white; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 220px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; }
        .product-info { padding: 15px; }
        .brand { font-size: 12px; color: #888; margin-bottom: 5px; }
        .name { font-size: 14px; font-weight: bold; margin-bottom: 8px; height: 40px; overflow: hidden; }
        .price-row { display: flex; align-items: center; gap: 8px; }
        .discount { color: #e74c3c; font-weight: bold; }
        .price { font-size: 18px; font-weight: 800; }
        .badge { display: inline-block; background: #eee; padding: 2px 6px; font-size: 11px; margin-top: 8px; border-radius: 4px; }

        /* 실험용 타겟 버튼 */
        .buy-btn { width: 100%; padding: 10px; background: white; border: 1px solid #333; margin-top: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .buy-btn:hover { background: #333; color: white; }
    </style>

        <div class="filter-group">
            <h3>정렬</h3>

            <div class="filter-item"><input type="checkbox"> 무료배송</div>

<!-- Start 스크롤 50% 측정 Code -->
<script>
    window.addEventListener('scroll', function() {
        // 현재 스크롤 위치 계산
        let h = document.documentElement, 
            b = document.body,
            st = 'scrollTop',
            sh = 'scrollHeight';
        
        let percent = (h[st]||b[st]) / ((h[sh]||b[sh]) - h.clientHeight) * 100;

        // 스크롤이 50%를 넘었을 때 VWO에 이벤트 전송
        if (percent >= 50 && !window.sentVwoScrollEvent) {
            window.vwoCode = window.vwoCode || [];
            window.vwoCode.push(['event', 'scroll_50']); 
            window.sentVwoScrollEvent = true; 
            console.log("VWO 스크롤 50% 이벤트 전송 완료!");
        }
    });
</script>
